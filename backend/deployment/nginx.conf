# Nginx Reverse Proxy & Load Balancer Configuration for GramUdyam Platform
# Production-ready setup: Round-robin load balancing, TLS termination, WebSocket passthrough

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Upstream stateless FastAPI workers (Uvicorn instances)
    upstream backend_cluster {
        # Round-robin load balancing
        server 127.0.0.1:8000;
        server 127.0.0.1:8001 backup;
        server 127.0.0.1:8002 backup;
        keepalive 32;
    }

    server {
        listen 80;
        server_name api.gramudyam.gov.in localhost;

        # API Gateway
        location /api/ {
            proxy_pass http://backend_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket upgrade passthrough
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400s;
        }

        # Swagger Docs
        location /docs {
            proxy_pass http://backend_cluster/docs;
        }

        location /openapi.json {
            proxy_pass http://backend_cluster/openapi.json;
        }

        # Health Check
        location /health {
            proxy_pass http://backend_cluster/;
        }
    }
}
